<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6a84f"/>
      <stop offset="50%" stop-color="#f2d27a"/>
      <stop offset="100%" stop-color="#b77b24"/>
    </linearGradient>

    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f2945"/>
      <stop offset="100%" stop-color="#5a2430"/>
    </linearGradient>

    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a0b6"/>
      <stop offset="100%" stop-color="#c94c70"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-color="#5a2430"
        flood-opacity="0.18"
      />
    </filter>
  </defs>

  <!-- Background -->
  <circle
    cx="256"
    cy="256"
    r="242"
    fill="#fbf5ed"
  />

  <!-- Outer gold border -->
  <circle
    cx="256"
    cy="256"
    r="238"
    fill="none"
    stroke="url(#gold)"
    stroke-width="14"
  />

  <!-- Inner border -->
  <circle
    cx="256"
    cy="256"
    r="220"
    fill="none"
    stroke="#ead9bd"
    stroke-width="3"
  />

  <!-- Decorative C -->
  <path
    d="
      M 350 137
      C 321 112, 285 99, 246 100
      C 171 101, 111 159, 111 237
      C 111 316, 171 373, 247 373
      C 291 373, 329 358, 357 329
    "
    fill="none"
    stroke="url(#burgundy)"
    stroke-width="34"
    stroke-linecap="round"
    filter="url(#shadow)"
  />

  <!-- Gold accent -->
  <path
    d="
      M 351 137
      C 323 119, 292 110, 258 111
      C 195 113, 143 163, 143 237
      C 143 305, 194 349, 254 350
      C 288 350, 317 339, 341 319
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Floral stem -->
  <path
    d="M 147 306 C 127 282, 117 255, 121 224"
    fill="none"
    stroke="url(#gold)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Leaf 1 -->
  <path
    d="M 133 269
       C 104 250, 105 222, 127 204
       C 151 220, 151 246, 133 269Z"
    fill="url(#gold)"
  />

  <!-- Leaf 2 -->
  <path
    d="M 139 238
       C 113 222, 116 195, 141 180
       C 162 200, 158 222, 139 238Z"
    fill="#b98232"
  />

  <!-- Lotus flower -->
  <g transform="translate(122 170)">
    <path
      d="M 0 48
         C -29 31,-30 4,-10 -15
         C 1 1,8 22,0 48Z"
      fill="url(#pink)"
      stroke="#9a3851"
      stroke-width="3"
    />

    <path
      d="M 10 46
         C -5 16,4 -12,28 -25
         C 35 0,31 27,10 46Z"
      fill="#e87898"
      stroke="#9a3851"
      stroke-width="3"
    />

    <path
      d="M 20 46
         C 20 12,39 -10,61 -15
         C 61 15,48 36,20 46Z"
      fill="url(#pink)"
      stroke="#9a3851"
      stroke-width="3"
    />

    <path
      d="M 4 46
         C 28 18,53 18,72 39
         C 51 55,27 57,4 46Z"
      fill="#f2a3b8"
      stroke="#9a3851"
      stroke-width="3"
    />

    <circle
      cx="29"
      cy="43"
      r="7"
      fill="url(#gold)"
    />
  </g>

  <!-- Gold sweeping ribbon -->
  <path
    d="
      M 105 317
      C 164 355, 235 361, 307 333
      C 351 316, 383 292, 411 265
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Heart -->
  <path
    d="
      M 404 263
      C 394 246, 367 251, 367 271
      C 367 291, 404 310, 404 310
      C 404 310, 441 291, 441 271
      C 441 251, 414 246, 404 263Z
    "
    fill="none"
    stroke="url(#burgundy)"
    stroke-width="7"
  />

  <!-- Small decorative dots -->
  <circle cx="370" cy="180" r="6" fill="#d6a84f"/>
  <circle cx="389" cy="165" r="4" fill="#c94c70"/>
  <circle cx="407" cy="181" r="5" fill="#d6a84f"/>

  <!-- Small stars -->
  <path
    d="M 375 204 L 380 216 L 392 221 L 380 226 L 375 238 L 370 226 L 358 221 L 370 216Z"
    fill="#d6a84f"
  />

  <!-- Bottom brand initials -->
  <text
    x="256"
    y="425"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58"
    font-weight="600"
    letter-spacing="5"
    fill="url(#burgundy)"
  >
    CC
  </text>

  <!-- Bottom decorative line -->
  <path
    d="M 170 451 Q 256 465 342 451"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>